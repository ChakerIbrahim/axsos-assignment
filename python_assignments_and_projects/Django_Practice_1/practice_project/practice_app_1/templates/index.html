<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/stle.css' %}">
    <script src="{% static 'js/script.js' %}"></script>
</head>
<body>
    <h1>Info From Server:</h1>
    <p>Name: {{ name  }}</p>
    <p>Color: {{ favorite_color  }}</p>
    <p>Pets:</p>
    <ul>
        {% for pet in pets %}
            <li>{{  pet  }}</li>
        {% endfor %}
    </ul>
    <img src="{% static 'images/0I3A6481.JPG' %}" alt="cat">
</body>
</html>
