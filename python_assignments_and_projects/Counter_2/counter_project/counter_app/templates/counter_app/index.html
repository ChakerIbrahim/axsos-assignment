<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #333;
        }
        .counter-value {
            font-size: 4rem;
            font-weight: bold;
            color: #4a90e2;
            margin: 20px 0;
        }
        .visits-info {
            color: #888;
            font-size: 1rem;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        button, a.btn {
            padding: 10px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s;
        }
        .btn-reset {
            background-color: #e74c3c;
            color: white;
        }
        .btn-reset:hover { background-color: #c0392b; }
        .btn-plus2 {
            background-color: #2ecc71;
            color: white;
        }
        .btn-plus2:hover { background-color: #27ae60; }
        .custom-form {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }
        .custom-form input {
            padding: 10px;
            width: 80px;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }
        .btn-custom {
            background-color: #9b59b6;
            color: white;
        }
        .btn-custom:hover { background-color: #8e44ad; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Counter</h1>

        <!-- Main counter value -->
        <div class="counter-value">{{ counter }}</div>

        <!-- SENSEI BONUS: show page visit count alongside counter -->
        <p class="visits-info">You have visited this page {{ visits }} time{{ visits|pluralize }}.</p>

        <div class="buttons">
            <!-- NINJA BONUS: Reset button using destroy_session route -->
            <a href="/destroy_session" class="btn btn-reset">Reset</a>

            <!-- NINJA BONUS: +2 button -->
            <a href="/increment_by_two" class="btn btn-plus2">+2</a>
        </div>

        <!-- SENSEI BONUS: Custom increment form -->
        <form method="POST" action="/custom_increment" class="custom-form">
            {% csrf_token %}
            <input type="number" name="amount" placeholder="N" min="1" required>
            <button type="submit" class="btn-custom" style="padding:10px 20px; border-radius:8px; border:none; cursor:pointer;">
                Add N
            </button>
        </form>
    </div>
</body>
</html>
