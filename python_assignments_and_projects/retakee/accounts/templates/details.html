<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details</title>
</head>
<body>
    <h1>{{ project.name }}</h1>

    <p>
        Owner:
        {{ project.owner.first_name }}
        {{ project.owner.last_name }}
    </p>

    <p>{{ project.description }}</p>

    <h2>Team</h2>

    <ul>
        {% for member in project.members.all %}
        <li>
            {{ member.first_name }}
            {{ member.last_name }}
        </li>
    </ul>
</body>
</html>
