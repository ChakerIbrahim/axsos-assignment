<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Author Description</title>
</head>
<body>
    <h1>{{ author.firstname }} {{ author.lastname }}</h1>
    <h2>ID:{{ author.id }}</h2>
    <h2>Notes</h2><p>{{ author.notes }}</p>
    <h2>Books</h2>
    <ul>
        {% for book in books %}
        <li>{{ book.title }} </li>
        {% endfor %}
    </ul>
    <form action="/addbooktoauthor/{{ author.id }}/" method="POST">
        {% csrf_token %}
        <select name="book_id" id="books">
            {% for book in all_books %}
            <option value="{{ book.id }}">{{ book.title }} </option>
            {% endfor %}
        </select>
        <button type="submit">Add</button>
    </form>
    
</body>
</html>
