<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TV Shows</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .errors { background: #ffe0e0; border: 1px solid #f00; padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .errors ul { margin: 0; padding-left: 20px; }
        .field-error { color: red; font-size: 0.85em; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, textarea, select { width: 100%; padding: 6px; box-sizing: border-box; }
        button, a.btn { padding: 8px 14px; margin-right: 8px; text-decoration: none; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; }
        .btn-danger  { background: #dc3545; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        th { background: #f0f0f0; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
