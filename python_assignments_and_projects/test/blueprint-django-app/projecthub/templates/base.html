{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Blueprint{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="topbar">
    <a href="{% if user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'auth' %}{% endif %}" class="brand">
      <span class="brand-mark"></span>
      Blueprint
    </a>
    {% if user.is_authenticated %}
    <div class="topbar-right">
      <span>{{ user.full_name }}</span>
      <a href="{% url 'logout' %}">Log out</a>
    </div>
    {% endif %}
  </header>

  <main class="page{% block page_class %}{% endblock %}">
    {% if messages %}
      {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
