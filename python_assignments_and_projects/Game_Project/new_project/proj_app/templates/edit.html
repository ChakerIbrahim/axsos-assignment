<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Game</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">

        <h2 class="mb-4">Edit Game</h2>

        <div class="card p-4 shadow-sm">
            <form action="/edit/game/{{ show_game.id }}/" method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label>Game Name</label>
                    <input type="text" name="game_name" class="form-control" value="{{ show_game.game_name }}">
                </div>
                <div class="mb-3">
                    <label>Genre</label>
                    <select name="genre" class="form-control">
                        <option value="Action" {% if show_game.genre == "Action" %}selected{% endif %}>Action</option>
                        <option value="RPG" {% if show_game.genre == "RPG" %}selected{% endif %}>RPG</option>
                        <option value="Arcade" {% if show_game.genre == "Arcade" %}selected{% endif %}>Arcade</option>
                        <option value="Tactical shooter" {% if show_game.genre == "Tactical shooter" %}selected{% endif %}>Tactical Shooter</option>
                        <option value="Adventure" {% if show_game.genre == "Adventure" %}selected{% endif %}>Adventure</option>
                        <option value="Puzzle" {% if show_game.genre == "Puzzle" %}selected{% endif %}>Puzzle</option>
                        <option value="Strategy" {% if show_game.genre == "Strategy" %}selected{% endif %}>Strategy</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label>Release Date</label>
                    <input type="date" name="relese_date" class="form-control" value="{{ show_game.relese_date }}">
                </div>
                <div class="mb-3">
                    <label>Description</label>
                    <textarea name="description" class="form-control" rows="5">{{ show_game.description }}</textarea>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary">Apply</button>
                    <a href="/dashboard/" class="btn btn-secondary">Cancel</a>
                </div>
            </form>

            {% if messages %}
            <ul class="list-unstyled mt-3">
                {% for message in messages %}
                <li class="alert alert-danger py-1">{{ message }}</li>
                {% endfor %}
            </ul>
            {% endif %}
        </div>

    </div>
</body>
</html>
