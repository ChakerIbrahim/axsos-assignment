{% extends 'base.html' %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="auth-card" style="max-width:420px;margin:80px auto;text-align:center;">
    <h2>Welcome, {{ request.user.first_name }} {{ request.user.last_name }} 👋</h2>
    <p style="color:#6b7185;">You're logged in as {{ request.user.email }}.</p>
    <a href="{% url 'logout' %}" class="btn btn-secondary" style="display:inline-block;margin-top:16px;">Logout</a>
</div>
{% endblock %}
