<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Delete</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; text-align: center; }
        h1 { color: #333; }
        p { margin: 15px 0; }
        .course-info { background: #f9f9f9; padding: 15px; margin: 20px auto; max-width: 500px; border: 1px solid #ddd; }
        button, a {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>Confirm Deletion</h1>
    <p>Are you sure you want to delete the following course?</p>
    
    <div class="course-info">
        <p><strong>Name:</strong> {{ course.name }}</p>
        <p><strong>Description:</strong> {{ course.description.text }}</p>
    </div>
    
    <form method="post" style="display: inline;">
        {% csrf_token %}
        <input type="hidden" name="confirm" value="yes">
        <button type="submit" style="background-color: red; color: white; padding: 10px 20px; margin-right: 10px;">Yes, delete it</button>
    </form>
    
    <a href="{% url 'home' %}" style="padding: 10px 20px; background-color: gray; color: white; text-decoration: none; display: inline-block;">No, cancel</a>
</body>
</html>
