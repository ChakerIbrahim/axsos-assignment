# ---------- JSP view resolver ----------
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp

# ---------- MySQL datasource ----------
# createDatabaseIfNotExist=true auto-creates the schema the first time you run
spring.datasource.url=jdbc:mysql://localhost:3306/save_travels?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# update: Hibernate creates/updates tables from your @Entity classes automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------- Enable HiddenHttpMethodFilter for PUT/DELETE from forms ----------
spring.mvc.hiddenmethod.filter.enabled=true

# ---------- Server ----------
server.port=8080
