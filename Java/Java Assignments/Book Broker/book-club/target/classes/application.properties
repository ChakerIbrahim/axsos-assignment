# Connects our application to the MySQL schema for this project
spring.datasource.url=jdbc:mysql://localhost:3306/bookclub
spring.datasource.username=root
spring.datasource.password=root
# Lets Hibernate create/update the users and books tables automatically
spring.jpa.hibernate.ddl-auto=update
# Tells Spring where to find our JSP view files
spring.mvc.view.prefix=/WEB-INF/
# Allows forms to send PUT and DELETE requests through the hidden _method input
spring.mvc.hiddenmethod.filter.enabled=true
