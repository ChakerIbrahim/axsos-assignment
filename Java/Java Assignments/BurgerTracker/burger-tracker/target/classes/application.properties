# --- Server ---
server.port=8080

# --- MySQL connection ---
# Create the database first, e.g.: CREATE DATABASE burger_tracker;
spring.datasource.url=jdbc:mysql://localhost:3306/burger_tracker?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# "update" lets Hibernate create/update the "burger" table for you automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# --- JSP view resolver ---
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
