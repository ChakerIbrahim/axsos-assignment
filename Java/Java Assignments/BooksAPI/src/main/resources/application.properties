spring.application.name=BooksAPI



# MySQL connection - adjust username/password/db name to match your local setup
spring.datasource.url=jdbc:mysql://localhost:3306/Books?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Server port (default is 8080, change if needed)
server.port=8080