# Connects our application to the MySQL schema for this project
spring.datasource.url=jdbc:mysql://localhost:3306/projectmanager?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
# Lets Hibernate create/update the tables automatically from our models
spring.jpa.hibernate.ddl-auto=update
# Tells Spring where to find our JSP view files
spring.mvc.view.prefix=/WEB-INF/
# Allows forms to send PUT and DELETE requests through the hidden _method input
spring.mvc.hiddenmethod.filter.enabled=true
# Hibernate re-validates entities when saving; our @Transient "confirm"
# is always null on users fetched from the DB, which would block every
# save (join/leave team). Turn OFF validation-on-save; @Valid in the
# controllers still validates all form submissions.
spring.jpa.properties.jakarta.persistence.validation.mode=none